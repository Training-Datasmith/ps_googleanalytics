services:
  mariadb:
    image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
    environment:
      MARIADB_DATABASE: ganalytics
      MARIADB_USER: ganalytics
      MARIADB_PASSWORD: ganalytics
      MARIADB_ROOT_PASSWORD: ganalytics
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  php:
    build:
      context: ..
      dockerfile: tests/docker/Dockerfile.php
    working_dir: /src
    volumes:
      - ..:/src
    environment:
      DB_HOST: 127.0.0.1
      DB_NAME: ganalytics
      DB_USER: ganalytics
      DB_PASSWORD: ganalytics
    network_mode: "service:mariadb"
    depends_on:
      mariadb:
        condition: service_healthy
